<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="my-day-release" content="20260904-7">
  <script>
  (function () {
    if (!("serviceWorker" in navigator)) return;
    var RELOAD_KEY = "my-day-sw-reloaded";
    var hadController = !!navigator.serviceWorker.controller;
    var refreshing = false;
    function clearReloadFlag() {
      try { window.sessionStorage.removeItem(RELOAD_KEY); } catch (e) {}
    }
    try {
      if (window.sessionStorage.getItem(RELOAD_KEY)) {
        window.setTimeout(clearReloadFlag, 2000);
      }
    } catch (e) {}
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!hadController || refreshing) return;
      try {
        if (window.sessionStorage.getItem(RELOAD_KEY)) return;
        window.sessionStorage.setItem(RELOAD_KEY, "1");
      } catch (err) {
        return;
      }
      refreshing = true;
      window.location.reload();
    });
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function (reg) {
      if (reg && typeof reg.update === "function") return reg.update();
    }).catch(function () {});
  })();
  </script>
  <title>Календарь — Мой день</title>
  <link rel="stylesheet" href="css/calendar.css?v=20260904-7">
</head>
<body>

  <div class="screen">

    <div class="statusbar" aria-hidden="true">
      <span class="statusbar__icons">
        <span>▪</span><span>▪</span><span>▪</span>
      </span>
      <span class="statusbar__time">09:41</span>
    </div>

    <main class="calendar-screen" aria-labelledby="calendar-title">

      <header class="calendar-hero">
        <div class="calendar-hero__top">
          <a class="back-btn" href="index.html" aria-label="Вернуться на главную">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"
                 stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="12 4 6 10 12 16"/>
            </svg>
          </a>
          <p class="calendar-hero__eyebrow">Календарь</p>
        </div>

        <div class="calendar-hero__row">
          <h1 class="calendar-hero__title" id="calendar-title">Июль 2026</h1>

          <div class="month-controls">
            <button
              class="month-nav current-month-btn"
              type="button"
              id="today-btn"
              aria-label="Текущий месяц"
              title="Текущий месяц"
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.7"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="2"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
                <line x1="8" y1="3" x2="8" y2="7"/>
                <line x1="16" y1="3" x2="16" y2="7"/>
                <circle cx="12" cy="15" r="1.5" fill="currentColor" stroke="none"/>
              </svg>
            </button>

            <button class="month-nav" type="button" id="prev-month" aria-label="Предыдущий месяц">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"
                   stroke="currentColor" stroke-width="1.7"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="12 4 6 10 12 16"/>
              </svg>
            </button>

            <button class="month-nav" type="button" id="next-month" aria-label="Следующий месяц">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"
                   stroke="currentColor" stroke-width="1.7"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="8 4 14 10 8 16"/>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <section class="calendar-card" aria-label="Сетка месяца">
        <div class="weekdays" aria-hidden="true">
          <span>Пн</span>
          <span>Вт</span>
          <span>Ср</span>
          <span>Чт</span>
          <span>Пт</span>
          <span>Сб</span>
          <span>Вс</span>
        </div>

        <div class="month-grid" id="month-grid"></div>
      </section>

      <section class="month-events selected-day" id="selected-day" hidden aria-labelledby="selected-day-title">
        <h2 class="month-events__title" id="selected-day-title"></h2>

        <div class="selected-day__add">
          <button class="selected-day__add-btn" type="button" id="selected-day-add-task">+ Задача</button>
          <button class="selected-day__add-btn" type="button" id="selected-day-add-birthday">+ День рождения</button>
          <button class="selected-day__add-btn" type="button" id="selected-day-add-important">+ Важная дата</button>
        </div>

        <div class="selected-day-form" id="selected-day-form" hidden>
          <form class="selected-day-form__form" id="selected-day-form-task" hidden>
            <label class="selected-day-form__field" for="selected-day-task-text">
              <span class="selected-day-form__label">Задача</span>
              <div class="selected-day-form__input-row">
                <input
                  class="selected-day-form__input"
                  id="selected-day-task-text"
                  name="taskText"
                  type="text"
                  maxlength="200"
                  autocomplete="off"
                >
                <button type="button" class="mic-btn" id="selected-day-task-voice" hidden aria-label="Голосовой ввод" aria-pressed="false">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
                       stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                       stroke-linejoin="round" aria-hidden="true">
                    <rect x="6.5" y="2" width="5" height="8.5" rx="2.5"/>
                    <path d="M4.2 9.2a4.8 4.8 0 0 1 9.6 0"/>
                    <line x1="9" y1="14" x2="9" y2="16.2"/>
                  </svg>
                </button>
              </div>
            </label>
            <p class="selected-day-form__date" id="selected-day-task-date"></p>
            <div class="selected-day-form__actions">
              <button class="selected-day-form__submit" type="submit">Сохранить</button>
              <button class="selected-day-form__cancel" type="button">Отмена</button>
            </div>
          </form>

          <form class="selected-day-form__form" id="selected-day-form-birthday" hidden>
            <label class="selected-day-form__field" for="selected-day-birthday-name">
              <span class="selected-day-form__label">Имя</span>
              <div class="selected-day-form__input-row">
                <input
                  class="selected-day-form__input"
                  id="selected-day-birthday-name"
                  name="birthdayName"
                  type="text"
                  maxlength="80"
                  autocomplete="off"
                >
                <button type="button" class="mic-btn" id="selected-day-birthday-voice" hidden aria-label="Голосовой ввод" aria-pressed="false">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
                       stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                       stroke-linejoin="round" aria-hidden="true">
                    <rect x="6.5" y="2" width="5" height="8.5" rx="2.5"/>
                    <path d="M4.2 9.2a4.8 4.8 0 0 1 9.6 0"/>
                    <line x1="9" y1="14" x2="9" y2="16.2"/>
                  </svg>
                </button>
              </div>
            </label>
            <p class="selected-day-form__date" id="selected-day-birthday-date"></p>
            <label class="selected-day-form__field" for="selected-day-birthday-year">
              <span class="selected-day-form__label">Год рождения</span>
              <input
                class="selected-day-form__input"
                id="selected-day-birthday-year"
                name="birthdayYear"
                type="number"
                min="1900"
                max="2100"
                inputmode="numeric"
              >
            </label>
            <label class="selected-day-form__field" for="selected-day-birthday-relation">
              <span class="selected-day-form__label">Кто это</span>
              <input
                class="selected-day-form__input"
                id="selected-day-birthday-relation"
                name="birthdayRelation"
                type="text"
                maxlength="80"
                autocomplete="off"
              >
            </label>
            <div class="selected-day-form__actions">
              <button class="selected-day-form__submit" type="submit">Сохранить</button>
              <button class="selected-day-form__cancel" type="button">Отмена</button>
            </div>
          </form>

          <form class="selected-day-form__form" id="selected-day-form-important" hidden>
            <label class="selected-day-form__field" for="selected-day-important-title">
              <span class="selected-day-form__label">Название</span>
              <div class="selected-day-form__input-row">
                <input
                  class="selected-day-form__input"
                  id="selected-day-important-title"
                  name="importantTitle"
                  type="text"
                  maxlength="120"
                  autocomplete="off"
                >
                <button type="button" class="mic-btn" id="selected-day-important-voice" hidden aria-label="Голосовой ввод" aria-pressed="false">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
                       stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                       stroke-linejoin="round" aria-hidden="true">
                    <rect x="6.5" y="2" width="5" height="8.5" rx="2.5"/>
                    <path d="M4.2 9.2a4.8 4.8 0 0 1 9.6 0"/>
                    <line x1="9" y1="14" x2="9" y2="16.2"/>
                  </svg>
                </button>
              </div>
            </label>
            <p class="selected-day-form__date" id="selected-day-important-date"></p>
            <fieldset class="selected-day-form__fieldset">
              <legend class="selected-day-form__label">Тип</legend>
              <label class="selected-day-form__radio">
                <input type="radio" name="selected-day-important-yearly" value="yearly" checked>
                <span>Ежегодное</span>
              </label>
              <label class="selected-day-form__radio">
                <input type="radio" name="selected-day-important-yearly" value="once">
                <span>Один раз</span>
              </label>
            </fieldset>
            <label class="selected-day-form__field" for="selected-day-important-category">
              <span class="selected-day-form__label">Категория</span>
              <select class="selected-day-form__input" id="selected-day-important-category" name="importantCategory">
                <option value="семья">Семья</option>
                <option value="работа">Работа</option>
                <option value="личное">Личное</option>
                <option value="учёба">Учёба</option>
                <option value="путешествия">Путешествия</option>
                <option value="другое">Другое</option>
              </select>
            </label>
            <label class="selected-day-form__field" for="selected-day-important-reminder">
              <span class="selected-day-form__label">Напоминание</span>
              <select class="selected-day-form__input" id="selected-day-important-reminder" name="importantReminder">
                <option value="">Без напоминания</option>
                <option value="in-day">В этот день</option>
                <option value="day-before">За день</option>
                <option value="week-before">За неделю</option>
              </select>
            </label>
            <div class="selected-day-form__actions">
              <button class="selected-day-form__submit" type="submit">Сохранить</button>
              <button class="selected-day-form__cancel" type="button">Отмена</button>
            </div>
          </form>
        </div>

        <div class="selected-day__body">
          <div class="selected-day__block">
            <h3 class="selected-day__block-title">Задачи</h3>
            <ul class="selected-day__list" id="selected-day-tasks" role="list"></ul>
          </div>
          <div class="selected-day__block">
            <h3 class="selected-day__block-title">Важные даты</h3>
            <ul class="selected-day__list" id="selected-day-important" role="list"></ul>
          </div>
          <div class="selected-day__block">
            <h3 class="selected-day__block-title">Праздники</h3>
            <ul class="selected-day__list" id="selected-day-holidays" role="list"></ul>
          </div>
          <div class="selected-day__block">
            <h3 class="selected-day__block-title">События</h3>
            <ul class="selected-day__list" id="selected-day-events" role="list"></ul>
          </div>
        </div>
      </section>

      <section class="month-events" id="month-events" hidden aria-labelledby="month-events-title">
        <h2 class="month-events__title" id="month-events-title">В этом месяце</h2>
        <div class="month-events__body" id="month-events-body"></div>
      </section>

    </main>

    <nav class="bottom-nav" aria-label="Навигация приложения">
      <a class="nav-btn" href="index.html">
        <svg class="nav-btn__icon" width="25" height="25" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span class="nav-btn__lbl">Главная</span>
      </a>
      <button class="nav-btn" type="button">
        <svg class="nav-btn__icon" width="25" height="25" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 11 12 14 22 4"/>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
        <span class="nav-btn__lbl">Задачи</span>
      </button>
      <button class="nav-btn nav-btn--active" type="button">
        <svg class="nav-btn__icon" width="25" height="25" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8"  y1="2" x2="8"  y2="6"/>
          <line x1="3"  y1="10" x2="21" y2="10"/>
        </svg>
        <span class="nav-btn__lbl">Календарь</span>
      </button>
      <a class="nav-btn" href="profile.html">
        <svg class="nav-btn__icon" width="25" height="25" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.08V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.08-.4H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.08V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.4.22.74.56 1 1 .24.43.37.92.4 1.4H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51-.4z"/>
        </svg>
        <span class="nav-btn__lbl">Настройки</span>
      </a>
    </nav>

  </div>

  <script src="js/orthodox-easter.js?v=20260904-7"></script>
  <script src="js/holidays-ru.js?v=20260904-7"></script>
  <script src="js/tasks-storage.js?v=20260904-7"></script>
  <script src="js/birthdays-storage.js?v=20260904-7"></script>
  <script src="js/important-dates-storage.js?v=20260904-7"></script>
  <script src="js/calendar.js?v=20260904-7"></script>
  <script>
    window.addEventListener("pageshow", function (event) {
      if (event.persisted) window.location.reload();
    });
  </script>
</body>
</html>
